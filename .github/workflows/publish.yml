name: Publish beta

on:
  push:
    tags:
      - "v1.0.0-beta.*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Verify release source
        run: node scripts/check-release-source.ts
      - run: bun install --frozen-lockfile
      - run: bun run release:check
      - run: bun run check
      - run: bun run test
      - run: bun run coverage
      - run: bun run declarations:check
      - run: bun run examples:check
      - run: bun scripts/examples.ts scenario
      - name: Verify packed artifacts
        run: bun run package:check
        env:
          SYNC_ENGINE_VERIFIED_TARBALLS: release
      - run: bun audit
      - run: sha256sum release/package.tgz > release/package.tgz.sha256
      - run: sha256sum release/analysis-package.tgz > release/analysis-package.tgz.sha256
      - run: sha256sum release/http-package.tgz > release/http-package.tgz.sha256
      - run: sha256sum release/catalog-package.tgz > release/catalog-package.tgz.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-npm-package
          path: |
            release/package.tgz
            release/package.tgz.sha256
            release/analysis-package.tgz
            release/analysis-package.tgz.sha256
            release/http-package.tgz
            release/http-package.tgz.sha256
            release/catalog-package.tgz
            release/catalog-package.tgz.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-npm-package
          path: release
      - name: Recheck release source and verified artifacts
        run: node scripts/check-release-source.ts release
      - run: npm publish ./release/package.tgz --provenance --tag beta --access public
      - run: npm publish ./release/analysis-package.tgz --provenance --tag beta --access public
      - run: npm publish ./release/http-package.tgz --provenance --tag beta --access public
      - run: npm publish ./release/catalog-package.tgz --provenance --tag beta --access public
