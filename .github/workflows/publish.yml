name: Publish beta

on:
  push:
    tags:
      - "v1.0.0-beta.*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: "24"
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Verify release source
        run: |
          node -e 'const { version } = require("./package.json");
          const expected = `v${version}`;
          if (process.env.GITHUB_REF_NAME !== expected || !/^1\.0\.0-beta\.(?:0|[1-9]\d*)$/.test(version)) {
            throw new Error(`Expected beta tag ${expected}; received ${process.env.GITHUB_REF_NAME}`);
          }'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: bun install --frozen-lockfile
      - run: bun run release:check
      - run: bun run check
      - run: bun run test
      - run: bun run coverage
      - run: bun run build
      - run: bun run declarations:check
      - run: bun run examples:check
      - run: bun run scenario
      - run: bun run package:check
      - run: bun audit

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/@mit-sdg/sync-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Recheck release source
        run: |
          node -e 'const { version } = require("./package.json");
          const expected = `v${version}`;
          if (process.env.GITHUB_REF_NAME !== expected || !/^1\.0\.0-beta\.(?:0|[1-9]\d*)$/.test(version)) {
            throw new Error(`Expected beta tag ${expected}; received ${process.env.GITHUB_REF_NAME}`);
          }'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: bun install --frozen-lockfile
      - run: bun run release:check
      - run: npm publish --provenance --tag beta --access public
